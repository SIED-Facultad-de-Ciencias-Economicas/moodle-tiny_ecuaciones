# Publica una versión: arma los ZIP instalables y los deja en Releases de GitHub. Corre al subir una
# etiqueta vX.Y.Z, o a mano desde Actions → «Publicar versión» → Run workflow, que crea la etiqueta
# sobre main con la versión de version.php ($plugin->release). Los ZIP son:
#   tiny_ecuaciones-X.Y.Z.zip             completo, con español: el que se instala en la FCE.
#   tiny_ecuaciones-X.Y.Z-directorio.zip  sólo con inglés, para moodle.org/plugins: las otras
#                                         traducciones se cargan en AMOS.
name: Publicar versión

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - name: Bajar el plugin
        uses: actions/checkout@v4
        with:
          path: ecuaciones

      - name: Versión y etiqueta
        working-directory: ecuaciones
        run: |
          release=$(sed -n "s/^\$plugin->release *= *'\(.*\)';.*/\1/p" version.php)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Etiqueta subida a mano: tiene que coincidir con version.php.
            echo "Etiqueta: ${GITHUB_REF_NAME#v} · version.php: $release"
            test "${GITHUB_REF_NAME#v}" = "$release"
          else
            # A mano desde Actions: sólo desde main, y crea la etiqueta si no existe.
            test "$GITHUB_REF_NAME" = "main"
            if git ls-remote --exit-code --tags origin "v$release" > /dev/null; then
              echo "La etiqueta v$release ya existe."
            else
              git tag "v$release"
              git push origin "v$release"
            fi
          fi
          echo "VERSION=$release" >> "$GITHUB_ENV"

      - name: Armar los ZIP
        run: |
          version="$VERSION"
          rm -rf ecuaciones/.git ecuaciones/.github
          zip -qr "tiny_ecuaciones-$version.zip" ecuaciones
          mkdir directorio
          cp -r ecuaciones directorio/
          find directorio/ecuaciones/lang -mindepth 1 -maxdepth 1 -type d ! -name en -exec rm -rf {} +
          (cd directorio && zip -qr "../tiny_ecuaciones-$version-directorio.zip" ecuaciones)
          unzip -l "tiny_ecuaciones-$version-directorio.zip" | grep "/lang/"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$VERSION" tiny_ecuaciones-*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" tiny_ecuaciones-*.zip \
              --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --verify-tag \
              --notes "Cambios en CHANGES.md. Para instalar en la FCE: tiny_ecuaciones-$VERSION.zip."
          fi
