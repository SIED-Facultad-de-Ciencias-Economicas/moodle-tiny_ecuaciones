# Pruebas de moodle-plugin-ci: las mismas que usa el equipo de Moodle al revisar un plugin del
# directorio (estilo de código, PHPDoc, validación, Mustache, grunt, PHPUnit y Behat).
name: Pruebas de Moodle

# En main al hacer push; en las otras ramas, por su PR (así no corre dos veces por cambio).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # La versión mínima que soporta el plugin, con el PHP más viejo que admite.
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'pgsql'

    steps:
      - name: Bajar el plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Instalar Moodle con el plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Sintaxis de PHP
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Estilo de código (Moodle Code Checker)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Documentación del código (PHPDoc)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validación del plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Puntos de actualización
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Plantillas Mustache
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: JavaScript y CSS (grunt)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations
